<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣杯图标重新设计预览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 10px; font-size: 2rem; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 40px; }
        .section { margin-bottom: 60px; }
        .section-title { font-size: 1.5rem; margin-bottom: 24px; text-align: center; border-bottom: 2px solid #333; padding-bottom: 12px; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .option-card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; text-align: center; border: 2px solid #10b981; }
        .option-card.warning { border-color: #f59e0b; }
        .option-badge { display: inline-block; padding: 4px 12px; background: #10b981; color: white; border-radius: 20px; font-size: 0.75rem; margin-bottom: 16px; }
        .option-title { font-size: 1.25rem; margin-bottom: 20px; }
        .preview-area { background: #fff; border-radius: 12px; padding: 40px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
        .preview-area.dark { background: #1a1a2e; }
        .option-desc { color: #ccc; font-size: 0.9rem; line-height: 1.6; }

        .spacing-demo {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 圣杯图标重新设计预览</h1>
        <p class="subtitle">在当前设计基础上调整：两个杯形状完全一样</p>

        <!-- 方案对比 -->
        <div class="section">
            <h2 class="section-title">设计方案对比</h2>
            <div class="options-grid">
                <!-- 当前设计 -->
                <div class="option-card warning">
                    <div class="option-title" style="color: #f59e0b;">当前设计</div>
                    <div class="preview-area">
                        <svg viewBox="0 0 100 120" width="150" height="180">
                            <defs>
                                <linearGradient id="cupRedGradientOld" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#dc2626" />
                                    <stop offset="100%" stopColor="#7f1d1d" />
                                </linearGradient>
                            </defs>
                            <g transform="translate(20, 30)">
                                <path d="M 30 0 Q 5 30 30 60 Q 35 30 30 0" fill="url(#cupRedGradientOld)" stroke="#450a0a" strokeWidth="1.5"/>
                            </g>
                            <g transform="translate(50, 30)">
                                <path d="M 0 0 Q 25 30 0 60 Q -5 30 0 0" fill="url(#cupRedGradientOld)" stroke="#450a0a" strokeWidth="1.5"/>
                            </g>
                        </svg>
                    </div>
                    <p class="option-desc">两个杯形状略有不同，合起来像叶子</p>
                </div>

                <!-- 新设计（保持当前粗细） -->
                <div class="option-card">
                    <div class="option-badge">新设计</div>
                    <div class="option-title">两个一模一样的杯（保持当前粗细）</div>
                    <div class="preview-area">
                        <svg viewBox="0 0 100 120" width="150" height="180">
                            <defs>
                                <linearGradient id="cupRedGradientNew" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#dc2626" />
                                    <stop offset="100%" stopColor="#7f1d1d" />
                                </linearGradient>
                            </defs>
                            <!-- 左杯 - 与当前左杯相同 -->
                            <g transform="translate(15, 30)">
                                <path d="M 30 0 Q 5 30 30 60 Q 35 30 30 0" fill="url(#cupRedGradientNew)" stroke="#450a0a" strokeWidth="1.5"/>
                            </g>
                            <!-- 右杯 - 左杯的镜像，形状完全相同 -->
                            <g transform="translate(55, 30)">
                                <path d="M 0 0 Q 25 30 0 60 Q -5 30 0 0" fill="url(#cupRedGradientNew)" stroke="#450a0a" strokeWidth="1.5"/>
                            </g>
                        </svg>
                    </div>
                    <p class="option-desc">保持当前的粗细风格，两个杯形状完全一样（右杯是左杯的镜像）</p>
                </div>
            </div>
        </div>

        <!-- 手势测算页面效果 -->
        <div class="section">
            <h2 class="section-title">手势测算页面效果（带间距）</h2>
            <div class="option-card" style="max-width: 700px; margin: 0 auto;">
                <div class="option-title">两个圣杯分开显示，中间10px间距</div>
                <div class="preview-area dark">
                    <div class="spacing-demo">
                        <!-- 左杯 -->
                        <svg viewBox="0 0 60 80" width="140" height="186">
                            <defs>
                                <linearGradient id="cupRedGradientDemo1" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#dc2626" />
                                    <stop offset="100%" stopColor="#7f1d1d" />
                                </linearGradient>
                            </defs>
                            <g transform="translate(5, 10)">
                                <path d="M 30 0 Q 5 30 30 60 Q 35 30 30 0" fill="url(#cupRedGradientDemo1)" stroke="#450a0a" strokeWidth="2"/>
                            </g>
                        </svg>
                        <!-- 间距提示 -->
                        <div style="width: 10px; display: flex; align-items: center; justify-content: center;">
                            <span style="color: #888; font-size: 12px; writing-mode: vertical-rl;">10px</span>
                        </div>
                        <!-- 右杯 -->
                        <svg viewBox="0 0 60 80" width="140" height="186">
                            <defs>
                                <linearGradient id="cupRedGradientDemo2" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#dc2626" />
                                    <stop offset="100%" stopColor="#7f1d1d" />
                                </linearGradient>
                            </defs>
                            <g transform="translate(25, 10)">
                                <path d="M 0 0 Q 25 30 0 60 Q -5 30 0 0" fill="url(#cupRedGradientDemo2)" stroke="#450a0a" strokeWidth="2"/>
                            </g>
                        </svg>
                    </div>
                </div>
                <p class="option-desc">在手势测算页面中，两个圣杯作为独立组件显示，中间有10px间距</p>
            </div>
        </div>
    </div>
</body>
</html>
